{% extends "base.html" %}
{% block title %}New participant{% endblock %}
{% block content %}
<h1>A few details</h1>
<p>First time seeing this participant ID - these are needed for age/education-adjusted (personalized) scoring.</p>
{% if error %}
<p class="disclaimer">{{ error }}</p>
{% endif %}
<form method="post">
  <label for="age">Age</label>
  <input type="number" id="age" name="age" min="1" max="120" required>

  <label for="education">Years of education</label>
  <input type="number" id="education" name="education" min="0" max="30" required>

  <label for="sex">Sex</label>
  <select id="sex" name="sex" required>
    <option value="M">M</option>
    <option value="F">F</option>
  </select>

  <button type="submit">Continue</button>
</form>
{% endblock %}
