<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Cognitive Test Demo{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .disclaimer { background: #fff3cd; border: 1px solid #e0c26a; padding: 0.6rem 0.9rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .stimulus { font-size: 2rem; font-weight: bold; text-align: center; padding: 2rem 0; min-height: 3rem; }
    input[type=text], textarea, input[type=number] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; margin: 0.4rem 0; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 0.6rem; }
    .word-list { font-size: 1.3rem; text-align: center; padding: 1.5rem; background: #f4f4f4; border-radius: 6px; letter-spacing: 0.05em; }
    table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.85rem; }
    .serial-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
    .serial-row label { flex: 1; }
    .serial-row input { width: 6rem; }
    footer { margin-top: 3rem; font-size: 0.8rem; color: #777; }
  </style>
</head>
<body>
  <div class="disclaimer">This is a learning/demo tool, <strong>not a diagnosis</strong>. See <code>docs/limitations.md</code> and <code>docs/ethics.md</code>.</div>
  {% block content %}{% endblock %}
  <footer>Cognitive Decline Prediction - local demo</footer>
</body>
</html>
