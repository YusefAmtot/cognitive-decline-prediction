<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Cognitive Test Demo{% endblock %}</title>
  <style>
    :root { --domain-1: #2a78d6; --domain-2: #eb6834; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    .disclaimer { background: #fff3cd; border: 1px solid #e0c26a; padding: 0.6rem 0.9rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .stimulus { font-size: 2rem; font-weight: bold; text-align: center; padding: 2rem 0; min-height: 3rem; }
    input[type=text], textarea, input[type=number] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; margin: 0.4rem 0; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 0.6rem; }
    .word-list { font-size: 1.3rem; text-align: center; padding: 1.5rem; background: #f4f4f4; border-radius: 6px; letter-spacing: 0.05em; }
    table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.85rem; }
    .serial-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
    .serial-row label { flex: 1; }
    .serial-row input { width: 6rem; }
    footer { margin-top: 3rem; font-size: 0.8rem; color: #777; }
    .chart { border: 1px solid #ccc; border-radius: 6px; padding: 0.8rem; margin: 1.2rem 0; }
    .chart figcaption h3 { margin: 0 0 0.1rem 0; font-size: 1rem; }
    .chart-unit { margin: 0 0 0.5rem 0; font-size: 0.85rem; color: #555; }
    .line-chart { display: block; width: 100%; height: auto; }
    .chart-axis { stroke: #888; stroke-width: 1; }
    .chart-axis-label { font-size: 11px; fill: #333; }
    .chart-line { fill: none; stroke: #1a5276; stroke-width: 3; }
    .chart-point { fill: #1a5276; stroke: #fff; stroke-width: 1.5; }
    .chart-point-label { font-size: 11px; font-weight: 600; fill: #1a5276; }
    .chart-table { font-size: 0.8rem; margin-top: 0.6rem; }
    .chart-table caption { text-align: left; font-size: 0.75rem; color: #555; margin-bottom: 0.2rem; }
    .chart-legend { display: flex; gap: 1.2rem; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .chart-legend-item { display: inline-flex; align-items: center; gap: 0.4rem; }
    .chart-legend-swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .chart-legend-swatch.domain-series-1 { background: var(--domain-1); }
    .chart-legend-swatch.domain-series-2 { background: var(--domain-2); }
    .chart-line.domain-series-1 { stroke: var(--domain-1); }
    .chart-line.domain-series-2 { stroke: var(--domain-2); }
    .chart-point.domain-series-1 { fill: var(--domain-1); }
    .chart-point.domain-series-2 { fill: var(--domain-2); }
    .chart-end-label { font-size: 11px; font-weight: 600; fill: #333; }
    .chart-zero-line { stroke: #999; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      :root { --domain-1: #3987e5; --domain-2: #d95926; }
      body { background: #1b1b1b; color: #eee; }
      .word-list { background: #2a2a2a; }
      .chart-axis { stroke: #999; }
      .chart-axis-label { fill: #ddd; }
      .chart-line { stroke: #6fa8dc; }
      .chart-point { fill: #6fa8dc; stroke: #1b1b1b; }
      .chart-point-label { fill: #6fa8dc; }
      .chart-point.domain-series-1, .chart-point.domain-series-2 { stroke: #1b1b1b; }
      .chart-end-label { fill: #ddd; }
      .chart-zero-line { stroke: #777; }
      th, td { border-color: #555; }
    }
  </style>
</head>
<body>
  <div class="disclaimer">This is a learning/demo tool, <strong>not a diagnosis</strong>. See <code>docs/limitations.md</code> and <code>docs/ethics.md</code>.</div>
  {% block content %}{% endblock %}
  <footer>Cognitive Decline Prediction - local demo</footer>
</body>
</html>
